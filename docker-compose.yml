services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_MAJOR: 22
    volumes:
      - .:/srv
    tty: true
    stdin_open: true

  mkdocs:
    build:
      context: .
      dockerfile: ./ops/docker/mkdoc/Dockerfile
    environment:
        PLANTUML_SERVER_URL: http://plantuml:8080/plantuml
    volumes:
      - ./docs:/docs/docs
      - ./README.md:/docs/README.md
      - ./mkdocs.yml:/docs/mkdocs.yml
      - ./site:/docs/site
    ports:
      - "8000:8000"
    command: mkdocs serve --dev-addr=0.0.0.0:8000 --livereload
    links:
      - plantuml

  # Zettai（第 9 章）の結合テスト用。既存サービスの定義は変えていない。
  zettai-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zettai
      POSTGRES_USER: zettai
      POSTGRES_PASSWORD: zettai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zettai -d zettai"]
      interval: 2s
      timeout: 3s
      retries: 30

  plantuml:
    image: plantuml/plantuml-server:jetty
    environment:
      BASE_URL: plantuml
