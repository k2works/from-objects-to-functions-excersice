name: Kotlin Zettai

on:
  push:
    branches:
      - main
    paths:
      - 'apps/kotlin/zettai/**'
      - 'docs/article/zettai/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/kotlin-zettai.yml'
  pull_request:
    paths:
      - 'apps/kotlin/zettai/**'
      - 'docs/article/zettai/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/kotlin-zettai.yml'
  workflow_dispatch:

jobs:
  check:
    name: build, test, coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/kotlin/zettai

    # 第 9 章の結合テスト用。docker-compose.yml の zettai-db と同じ設定にしている。
    # ローカルと CI で接続先の形を揃え、テスト側の分岐を増やさないため。
    services:
      zettai-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zettai
          POSTGRES_USER: zettai
          POSTGRES_PASSWORD: zettai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zettai -d zettai"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # devShell と同じ JDK 21 を使う。ローカルと CI の判定を一致させるため
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # check にコンパイル・テスト（結合テストを含む）・カバレッジ検証（80%）が集約されている。
      # 結合テストを別ジョブに分けていない。分けるとローカルの ./gradlew check と
      # CI の判定が食い違い、「ローカルでは通るのに CI で落ちる」が起きる
      - name: Run check
        run: ./gradlew check

      - name: Generate coverage report
        if: always()
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: apps/kotlin/zettai/build/reports/kover/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/kotlin/zettai/**/build/reports/tests/

  article-code:
    name: article code examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 記事のコード例が実装に存在することを確かめる。
      # 逐語でない抜粋は記事側の code-check: ignore マーカーで除外する
      - name: Check article code examples
        run: python3 ops/scripts/article/check_article_code.py

      # 行長と import 順だけを見る。汎用の静的解析は入れていない（ADR-004）
      - name: Check code style
        run: python3 ops/scripts/article/check_code_style.py
