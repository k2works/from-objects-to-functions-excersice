name: Flix Zettai

on:
  push:
    branches: [main]
    paths:
      - 'apps/flix/zettai/**'
      - 'docs/article/zettai/flix/**'
      - 'ops/nix/environments/flix/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/flix-zettai.yml'
      - 'flake.nix'
  pull_request:
    paths:
      - 'apps/flix/zettai/**'
      - 'docs/article/zettai/flix/**'
      - 'ops/nix/environments/flix/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/flix-zettai.yml'
      - 'flake.nix'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flix/zettai
    # 第 9 章の結合テスト用。docker-compose.yml の zettai-db と同じ定義にする。
    services:
      zettai-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zettai
          POSTGRES_USER: zettai
          POSTGRES_PASSWORD: zettai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Read Flix version from flix.toml
        id: flix
        run: |
          version=$(grep -E '^flix[[:space:]]*=' flix.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download Flix
        run: |
          mkdir -p .flix
          curl -fsSL -o .flix/flix.jar \
            "https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar"
      - name: Check
        run: java -jar .flix/flix.jar check
      - name: Test
        run: java -jar .flix/flix.jar test

  article:
    runs-on: ubuntu-latest
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty
        ports:
          - 18080:8080
    env:
      NO_MKDOCS_2_WARNING: '1'
      PLANTUML_SERVER_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tools
        run: pip install mkdocs-material plantuml-markdown
      - run: python3 ops/scripts/article/check_article_code.py
      - run: python3 ops/scripts/article/check_code_style.py
      - run: python3 ops/scripts/article/check_sections.py
      - run: python3 ops/scripts/article/check_numbers.py
      - run: python3 ops/scripts/article/check_adr_references.py
      - run: mkdocs build --strict
