[package]
name = "zettai-step5-http"
edition.workspace = true
version.workspace = true

# **ドメインへの依存は一方向。** ドメイン側の Cargo.toml に
# zettai-step5-http は無い。だからドメインから HTTP は呼べない。
[dependencies]
zettai-step5-domain = { path = "../zettai-step5-domain" }
tiny_http = "0.12.0"
# 第 9 章。**同期のクレート**（ADR-024）。
postgres = "0.19.14"

# DB を使うテストは既定で走らせない。**別ジョブに分ける**（Unit 5 のゲート 1）。
# 書いている間は docker 無しで `just check` が通る。
[features]
db = []

# **段階ごとに実行ファイルの名前を分ける。** 同じ名前だと出力先が衝突し、
# cargo が警告を出す（#6313。将来はエラー）。
# ファイル名は変えない。第 2 章が src/bin/zettai.rs を指しているため。
[[bin]]
name = "zettai-step5"
path = "src/bin/zettai.rs"
