name: Scala Zettai

on:
  push:
    branches: [main]
    paths:
      - 'apps/scala/zettai/**'
      - 'docs/article/zettai/scala/**'
      - 'ops/nix/environments/scala/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/scala-zettai.yml'
      - 'flake.nix'
  pull_request:
    paths:
      - 'apps/scala/zettai/**'
      - 'docs/article/zettai/scala/**'
      - 'ops/nix/environments/scala/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/scala-zettai.yml'
      - 'flake.nix'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scala/zettai
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Test
        run: sbt -batch test

  article:
    runs-on: ubuntu-latest
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty
        ports:
          - 18080:8080
    env:
      NO_MKDOCS_2_WARNING: '1'
      PLANTUML_SERVER_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tools
        run: pip install mkdocs-material plantuml-markdown
      - run: python3 ops/scripts/article/check_article_code.py
      - run: python3 ops/scripts/article/check_code_style.py
      - run: python3 ops/scripts/article/check_sections.py
      - run: python3 ops/scripts/article/check_numbers.py
      - run: python3 ops/scripts/article/check_adr_references.py
      - run: mkdocs build --strict
