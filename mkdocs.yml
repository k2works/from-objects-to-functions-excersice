site_name: From Objects to Functions 演習
site_description: 関数型プログラミングで作る変更を楽に安全にできるソフトウェア
site_author: Project Team
repo_url: https://github.com/k2works/from-objects-to-functions-excersice
repo_name: from-objects-to-functions-excersice

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - assets/js/extra.js
  # 数式（MathJax 3）。設定を先に読み込んでから MathJax 本体を読み込む
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works
      name: GitHub Repository/claude-code-booster

plugins:
  - search

exclude_docs: |
  wiki
  article/fotf/

nav:
  - Home: index.md
  - 戦略:
      - 概要: strategy/index.md
  - 要件:
      - 概要: requirements/index.md
  - 設計:
      - 概要: design/index.md
  - 開発:
      - 概要: development/index.md
      - リリース計画: development/release_plan.md
      - 開発戦略: development/development_strategy.md
      - Bolt 計画:
          - Unit 1 実行環境と第 1 章: development/iteration_plan-1.md
          - Unit 2 ウォーキングスケルトンとドメイン分離: development/iteration_plan-2.md
      - Bolt 終了報告:
          - Unit 1 実行環境と第 1 章: development/bolt_report-1.md
  - 運用:
      - 概要: operation/index.md
  - ジャーナル:
      - 概要: journal/index.md
      - 2026-09-26: journal/20260926.md
  - レビュー:
