name: Rust Zettai

# **CI は just を通さず cargo を直接呼ぶ**（Unit 2 のゲート 1 で決定。ADR-026 に追記）。
#
# Nix を入れて just check-all を回す案も同じコミットで実測した。
# どちらも success だったが 525 秒対 17 秒（31 倍）だった。
#
# 代償は「検査の定義が justfile と ここ の 2 か所に分かれる」こと。
# **段を足すときは両方を直す。** DoD のチェック項目に入れてある。
on:
  push:
    branches: [main]
    paths:
      - 'apps/rust/zettai/**'
      - 'ops/nix/environments/rust/**'
      - '.github/workflows/rust-zettai.yml'
  pull_request:
    paths:
      - 'apps/rust/zettai/**'
      - 'ops/nix/environments/rust/**'
      - '.github/workflows/rust-zettai.yml'
  workflow_dispatch:

jobs:
  check:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rust/zettai
    steps:
      - uses: actions/checkout@v4

      # devShell と同じ 1.91.1 に合わせる（ops/nix/environments/rust/shell.nix）。
      # **版を変えるときは両方を直す。**
      - name: Set up Rust 1.91.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy, llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/zettai/target
          key: rust-cargo-${{ hashFiles('apps/rust/zettai/**/Cargo.toml') }}

      # 以下の 4 段は justfile の check-all と同じ内容にする。
      # 段を足すときは justfile と ここ の両方を直す。
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all
      - name: coverage
        run: cargo llvm-cov --all --fail-under-lines 80

  # 検査の定義が 2 か所に分かれた代償を、人の注意ではなく検査で押さえる。
  parity:
    name: justfile と CI が一致しているか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ops/scripts/check_rust_ci_parity.py
