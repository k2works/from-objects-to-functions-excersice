# 段階ごとにメンバーを増やす。
# Kotlin 版の Gradle モジュール、なでしこ3 版の src/stepN/ に対応する（ADR-015）。
# 過去の章のコードをそのまま残し、記事が指すコードが変化しないようにする。
[workspace]
resolver = "2"
members = ["zettai-step1-domain", "zettai-step1-http", "zettai-step2-domain", "zettai-step2-http", "zettai-step3-domain", "zettai-step3-http", "zettai-step4-domain", "zettai-step4-http"]
# スパイクは判断の記録として残すが、検査の対象外にする。
# sync-postgres は DB が要り、HTTP の 3 つは同じポートを使う。
exclude = ["spikes"]

[workspace.package]
edition = "2021"
version = "0.1.0"
