name: Kotlin FP Zettai

on:
  push:
    branches: [main]
    paths:
      - 'apps/kotlin-fp/zettai/**'
      - 'docs/article/zettai/kotlin-fp/**'
      - 'ops/nix/environments/kotlin-fp/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/kotlin-fp-zettai.yml'
      - 'flake.nix'
  pull_request:
    paths:
      - 'apps/kotlin-fp/zettai/**'
      - 'docs/article/zettai/kotlin-fp/**'
      - 'ops/nix/environments/kotlin-fp/**'
      - 'ops/scripts/article/**'
      - '.github/workflows/kotlin-fp-zettai.yml'
      - 'flake.nix'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kotlin-fp/zettai
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Run check
        run: bash ./gradlew check
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-fp-test-results
          path: apps/kotlin-fp/zettai/**/build/reports/tests/

  article:
    runs-on: ubuntu-latest
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty
        ports:
          - 18080:8080
    env:
      NO_MKDOCS_2_WARNING: '1'
      PLANTUML_SERVER_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tools
        run: pip install mkdocs-material plantuml-markdown
      - run: python3 ops/scripts/article/check_article_code.py
      - run: python3 ops/scripts/article/check_code_style.py
      - run: python3 ops/scripts/article/check_sections.py
      - run: python3 ops/scripts/article/check_numbers.py
      - run: python3 ops/scripts/article/check_adr_references.py
      - run: mkdocs build --strict
